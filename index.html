<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="viewTitle">Today</h1>
  <button id="syncBtn" class="icon-btn" aria-label="Sync now"><span id="syncDot" class="dot"></span><span id="syncText">Local</span></button>
  <button id="settingsBtn" class="icon-btn" aria-label="Settings">&#9881;</button>
</header>

<main id="view"></main>

<button id="fab" class="fab" aria-label="Add task">+</button>

<nav class="tabs">
  <button data-view="today" class="on"><span>&#9673;</span>Today</button>
  <button data-view="upcoming"><span>&#9638;</span>Upcoming</button>
  <button data-view="inbox"><span>&#9993;</span>Inbox</button>
  <button data-view="projects"><span>&#9776;</span>Projects</button>
  <button data-view="tiktok"><span>&#9654;</span>TikTok</button>
</nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-bg"></div>
  <div class="sheet" id="sheetBody"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
